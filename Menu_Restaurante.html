<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Menú del Restaurante</title><style>body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f8; color: #333; margin: 0; padding: 30px 10px; }.menu-container { max-width: 900px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }.header { text-align: center; margin-bottom: 40px; }h1 { color: #2c3e50; font-size: 2.5em; margin: 0; text-transform: uppercase; letter-spacing: 1px; }.subtitle { color: #7f8c8d; font-size: 1.1em; margin-top: 5px; }h2 { color: #d35400; border-bottom: 2px solid #ecf0f1; padding-bottom: 8px; margin-top: 40px; font-size: 1.5em; text-transform: uppercase; }.grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }.card { display: flex; align-items: center; background: #fff; border: 1px solid #ecf0f1; border-radius: 8px; padding: 15px; width: 48%; box-sizing: border-box; transition: transform 0.2s; }.card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.08); }.card img { width: 90px; height: 90px; object-fit: cover; border-radius: 6px; margin-right: 15px; background: #f9f9f9; border: 1px solid #eee; }.info { flex: 1; }.name { display: block; font-size: 1.2em; font-weight: bold; color: #2c3e50; margin-bottom: 6px; }.price { display: inline-block; font-size: 1.1em; color: #27ae60; font-weight: bold; background: #eafaf1; padding: 4px 8px; border-radius: 4px; }@media (max-width: 768px) { .card { width: 100%; } }</style></head><body><div class='menu-container'><div class='header'><h1>JavaBeans Café</h1><div class='subtitle'>Selección de calidad para nuestros clientes</div></div><h2>BEBIDA_CALIENTE</h2><div class='grid'><div class='card'><img src='imagenes_menu/Lets Meet for Coffee.jpeg' alt='Cafe con leche'><div class='info'><span class='name'>Cafe con leche</span><span class='price'>Q 15.00</span></div></div><div class='card'><img src='imagenes_menu/Lets Meet for Coffee.jpeg' alt='Cafe expreso'><div class='info'><span class='name'>Cafe expreso</span><span class='price'>Q 12.00</span></div></div></div><h2>COMIDA</h2><div class='grid'><div class='card'><img src='imagenes_menu/The Perfect Smash Burger on a Gas Griddle.jpeg' alt='Hamburguesa simple'><div class='info'><span class='name'>Hamburguesa simple</span><span class='price'>Q 25.00</span></div></div><div class='card'><img src='imagenes_menu/Lets Meet for Coffee.jpeg' alt='Producto prueba'><div class='info'><span class='name'>Producto prueba</span><span class='price'>Q 10.00</span></div></div></div></div></body></html>
